apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: nginx-eks-demo
  region: ap-south-1
  version: "1.36"

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  publicAccessCIDRs:
    - "43.204.38.68/32"

managedNodeGroups:
  - name: nginx-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    volumeType: gp3
